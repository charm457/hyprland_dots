# ==========================================
# THEME: WHITE LATTE (WARM PASTEL)
# ==========================================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(1e66f5) rgb(8839ef) 45deg
    col.inactive_border = rgb(bcc0cc)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.95
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = on
    }

    shadow {
        enabled = true
        range = 16
        render_power = 2
        color = rgba(00000020)
    }
}
