# ==========================================
# THEME: WHITE FROSTED GLASS
# ==========================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(0066cc88) rgba(ffffffaa) 45deg
    col.inactive_border = rgba(ffffff55)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.88
    inactive_opacity = 0.80
    fullscreen_opacity = 0.98

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = on
        brightness = 1.12
        contrast = 1.05
    }

    shadow {
        enabled = true
        range = 18
        render_power = 2
        color = rgba(00000025)
    }
}
