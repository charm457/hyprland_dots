# ==========================================
# THEME: CYBER NEON
# ==========================================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(ff007f) rgb(00f0ff) 45deg
    col.inactive_border = rgb(1b092b)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 0.92
    inactive_opacity = 0.84
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = on
        vibrancy = 0.3
        contrast = 1.15
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(ff007f33)
    }
}
