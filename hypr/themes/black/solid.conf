# ==========================================
# THEME: TOTAL BLACK (SOLID OLED)
# ==========================================
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(666666) rgb(333333) 45deg
    col.inactive_border = rgb(111111)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}
