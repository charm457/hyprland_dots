# ==========================================
# THEME: MACOS LIQUID GLASS (MONOCHROME B&W)
# ==========================================
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ffffff88) rgba(88888844) 45deg
    col.inactive_border = rgba(ffffff1f)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.80
    inactive_opacity = 0.70
    fullscreen_opacity = 0.95

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = on
        vibrancy = 0.35
        vibrancy_darkness = 0.15
        brightness = 1.06
        contrast = 1.10
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000050)
        offset = 0 8
    }
}

# ==========================================
# MACOS AUTHENTIC ANIMATIONS & BEZIERS
# ==========================================
animations {
    enabled = yes
    bezier = macEase, 0.25, 1, 0.5, 1
    bezier = macSpring, 0.16, 1, 0.3, 1
    bezier = macSmooth, 0.4, 0.0, 0.2, 1

    animation = windows, 1, 5, macEase, popin 85%
    animation = windowsIn, 1, 5, macEase, popin 85%
    animation = windowsOut, 1, 4, macEase, popin 85%
    animation = border, 1, 6, macEase
    animation = fade, 1, 4, macEase
    animation = workspaces, 1, 6, macSpring, slide
}
