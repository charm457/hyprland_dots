# ==========================================
# THEME: MACOS LIQUID GLASS (FULL TRANSPARENCY)
# ==========================================
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ffffff66) rgba(007aff88) 45deg
    col.inactive_border = rgba(ffffff1f)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.80
    inactive_opacity = 0.70
    fullscreen_opacity = 0.95

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = on
        vibrancy = 0.35
        vibrancy_darkness = 0.15
        brightness = 1.06
        contrast = 1.10
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000050)
        offset = 0 8
    }
}
