# ==========================================
# THEME: MACOS PITCH DARK (FULL DARK & MUTED WHITE)
# ==========================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(e5e5ea55) rgba(8e8e9333) 45deg
    col.inactive_border = rgba(1c1c1e66)
    layout = dwindle
}

decoration {
    rounding = 18
    active_opacity = 0.85
    inactive_opacity = 0.75
    fullscreen_opacity = 0.96

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = on
        vibrancy = 0.25
        brightness = 0.95
        contrast = 1.15
        noise = 0.02
    }

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = rgba(00000075)
        offset = 0 8
    }
}
