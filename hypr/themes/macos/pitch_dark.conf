# ==========================================
# THEME: MACOS / IOS TOTAL PITCH BLACK OLED
# ==========================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(666666) rgb(222222) 45deg
    col.inactive_border = rgb(141416)
    layout = dwindle
}

decoration {
    rounding = 18
    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = on
        vibrancy = 0.2
        brightness = 0.95
        contrast = 1.15
    }

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = rgba(00000088)
        offset = 0 8
    }
}

# ==========================================
# MACOS AUTHENTIC ANIMATIONS & BEZIERS
# ==========================================
animations {
    enabled = yes
    bezier = macEase, 0.25, 1, 0.5, 1
    bezier = macSpring, 0.16, 1, 0.3, 1
    bezier = macSmooth, 0.4, 0.0, 0.2, 1

    animation = windows, 1, 5, macEase, popin 85%
    animation = windowsIn, 1, 5, macEase, popin 85%
    animation = windowsOut, 1, 4, macEase, popin 85%
    animation = border, 1, 6, macEase
    animation = fade, 1, 4, macEase
    animation = workspaces, 1, 6, macSpring, slide
}
