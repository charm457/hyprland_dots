# ==========================================
# THEME: MACOS DARK GLASS
# ==========================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(0a84ff99) rgba(5e5ce666) 45deg
    col.inactive_border = rgba(2c2c2e55)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.86
    inactive_opacity = 0.76
    fullscreen_opacity = 0.98

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = on
        vibrancy = 0.25
        brightness = 1.02
        contrast = 1.05
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000060)
        offset = 0 6
    }
}
