# ==========================================
# THEME: MACOS DARK MONOCHROME (BLACK & WHITE)
# ==========================================
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(e5e5ea88) rgba(63636644) 45deg
    col.inactive_border = rgba(2c2c2e55)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.86
    inactive_opacity = 0.76
    fullscreen_opacity = 0.98

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = on
        vibrancy = 0.25
        brightness = 1.02
        contrast = 1.05
    }

    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000060)
        offset = 0 6
    }
}

# ==========================================
# MACOS AUTHENTIC ANIMATIONS & BEZIERS
# ==========================================
animations {
    enabled = yes
    bezier = macEase, 0.25, 1, 0.5, 1
    bezier = macSpring, 0.16, 1, 0.3, 1
    bezier = macSmooth, 0.4, 0.0, 0.2, 1

    animation = windows, 1, 5, macEase, popin 85%
    animation = windowsIn, 1, 5, macEase, popin 85%
    animation = windowsOut, 1, 4, macEase, popin 85%
    animation = border, 1, 6, macEase
    animation = fade, 1, 4, macEase
    animation = workspaces, 1, 6, macSpring, slide
}
