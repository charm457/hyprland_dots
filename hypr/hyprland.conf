# ==========================================
# HYPRLAND CONFIG - ГОЛУБАЯ ТЕМА С ПРОЗРАЧНОСТЬЮ
# ==========================================

# Мониторы
monitor=,preferred,auto,1

# Автозапуск
exec-once = waybar & swaybg -i /home/charm/wallpapers/lastday.jpg -m stretch & dunst & nm-applet & /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = sleep 2 && python3 ~/.config/hypr/sidebar/sidebar.py

# Программы
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun


env = GTK_USE_PORTAL=1
env = QT_QPA_PLATFORM=wayland
# ==========================================
# ВВОД (КЛАВИАТУРА)
# ==========================================
input {
    kb_layout = us,ru
    kb_variant = ,
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

# ==========================================
# ОФОРМЛЕНИЕ - ГОЛУБАЯ ТЕМА
# ==========================================
decoration {
    rounding = 12
    active_opacity = 0.95
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
    
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = on
        brightness = 1.2
        contrast = 1.1
    }
}
animations {
    enabled = yes
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, overshot, popin
    animation = border, 1, 6, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, overshot, slidevert
}

# ==========================================
# ГОРЯЧИЕ КЛАВИШИ
# ==========================================

# Запуск программ
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B, exec, firefox
bind = SUPER, E, exec, $fileManager
bind = SUPER, D, exec, $menu
bind = SUPER, SPACE, exec, $menu

# Управление окнами
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, P, pseudo

# Боковая панель (Win + P)
bind = SUPER, P, exec, ~/.config/hypr/sidebar/toggle.sh

# Сайдбар (Win+P) — GtkLayerShell панель строго справа (exclusive zone),
# резервирует место у правого края: плиточные окна сдвигаются влево,
# сайдбар не съезжает, фон чёрный.

# ==========================================
# WAYBAR — позиция панели
# ==========================================
# Super+Alt+P — цикл: верх → низ → скрыть → верх
bind = SUPER ALT, P,    exec, ~/.config/hypr/waybar_position.sh toggle
bind = SUPER ALT, up,   exec, ~/.config/hypr/waybar_position.sh top
bind = SUPER ALT, down, exec, ~/.config/hypr/waybar_position.sh bottom
bind = SUPER ALT, H,    exec, ~/.config/hypr/waybar_position.sh hide

# Фокус на окна
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Рабочие столы
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Перемещение окон между столами
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Громкость (если нужно)
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Яркость (если нужно)
bind = , XF86MonBrightnessUp, exec, brightnessctl s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Скриншоты
# ==========================================
# СКРИНШОТЫ
# ==========================================

# SUPER+SHIFT+S - Выбрать область и скопировать в буфер обмена
bind = SUPER SHIFT, S, exec, grimblast copy area

# SUPER+SHIFT+A - Выбрать область и сохранить в файл
bind = SUPER SHIFT, A, exec, grimblast save area ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# SUPER+SHIFT+P - Скриншот всего экрана и сохранить
bind = SUPER SHIFT, P, exec, grimblast save output ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# SUPER+SHIFT+C - Скриншот всего экрана и скопировать в буфер
bind = SUPER SHIFT, C, exec, grimblast copy output

# PrintScreen - Скриншот всего экрана и сохранить
bind = , Print, exec, grimblast save output ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# Shift+PrintScreen - Выбрать область и сохранить
bind = SHIFT, Print, exec, grimblast save area ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# Смена обоев (Win + ] следующий, Win + [ предыдущий, Win + W — случайный)
bind = SUPER, bracketright, exec, ~/.config/hypr/wallpaper_cycle.sh next
bind = SUPER, bracketleft,  exec, ~/.config/hypr/wallpaper_cycle.sh prev
bind = SUPER, W, exec, ~/.config/hypr/wallpaper_cycle.sh next

# ==========================================
# ИЗМЕНЕНИЕ РАЗМЕРА ОКОН (SUPER + CTRL + стрелки — держи для непрерывного)
# ==========================================
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, left,  resizeactive, -40 0
binde = SUPER CTRL, up,    resizeactive, 0 -40
binde = SUPER CTRL, down,  resizeactive, 0 40

# ПЕРЕМЕЩЕНИЕ ОКОН (SUPER + SHIFT + стрелки)
# bindl = работает независимо от раскладки клавиатуры
bindl = SUPER SHIFT, left,  exec, hyprctl dispatch movewindow l
bindl = SUPER SHIFT, right, exec, hyprctl dispatch movewindow r
bindl = SUPER SHIFT, up,    exec, hyprctl dispatch movewindow u
bindl = SUPER SHIFT, down,  exec, hyprctl dispatch movewindow d

# ==========================================
# ПРАВИЛА ДЛЯ ОКОН
# ==========================================

# Увеличенная прозрачность для некоторых окон
#windowrule = opacity 0.85 override 0.70 override, ^(kitty)$
#windowrule = opacity 0.90 override 0.75 override, ^(Alacritty)$

# VS Code максимальная прозрачность
#windowrule = opacity 0.92, code

# Улучшение читаемости текста
env = FREETYPE_PROPERTIES="truetype:interpreter-version=35"
env = GDK_BACKEND=wayland
env = QT_QPA_PLATFORM=wayland
env = QT_WAYLAND_FORCE_DPI=physical
