# ==============================================================================
# HYPRLAND MAIN CONFIGURATION
# Сборка с поддержкой стилей (Black, White, macOS Glass, Cyber)
# и переключением режимов окон (Tiling / Fullscreen с Waybar / Windows Mode)
# ==============================================================================

# Мониторы (автоматическое определение или настройка под себя)
monitor=,preferred,auto,1

# ==============================================================================
# АВТОЗАПУСК СЛУЖБ
# Безопасный запуск polkit, swaybg, waybar, dunst, nm-applet, sidebar
# ==============================================================================
exec-once = ~/.config/hypr/scripts/init_desktop.sh

# ==============================================================================
# ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ
# ==============================================================================
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = QT_WAYLAND_FORCE_DPI,physical
env = FREETYPE_PROPERTIES,truetype:interpreter-version=35
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ==============================================================================
# ПРИЛОЖЕНИЯ ПО УМОЛЧАНИЮ
# ==============================================================================
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun

# ==============================================================================
# АКТИВНЫЙ СТИЛЬ ОФОРМЛЕНИЯ
# Управляется через ~/.config/hypr/scripts/theme_ctl.sh или через Sidebar (Win+P)
# Доступны: Black (Solid, Stealth, Glass), White (Clean, Glass, Latte),
# macOS (Liquid Glass, Dark, Light), Cyber (Neon, Nord)
# ==============================================================================
source = ~/.config/hypr/current_theme.conf

# ==============================================================================
# ВВОД (КЛАВИАТУРА И ТАЧПАД)
# ==============================================================================
input {
    kb_layout = us,ru
    kb_variant = ,
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

# ==============================================================================
# АНИМАЦИИ
# ==============================================================================
animations {
    enabled = yes
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, overshot, popin
    animation = border, 1, 6, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, overshot, slidevert
}

dwindle {
    preserve_split = yes
}

# ==============================================================================
# ГОРЯЧИЕ КЛАВИШИ
# ==============================================================================

# Запуск программ
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, B,      exec, firefox
bind = SUPER, E,      exec, $fileManager
bind = SUPER, D,      exec, $menu
bind = SUPER, SPACE,  exec, $menu

# Закрытие активного окна
bind = SUPER, Q, killactive

# Безопасный выход из Hyprland
bind = SUPER SHIFT, M, exit

# ------------------------------------------------------------------------------
# РЕЖИМЫ ОКОН (Тайлинг / На весь экран с Waybar / Как в Windows)
# ------------------------------------------------------------------------------
# 1. SUPER + Z (или SUPER + M) — На весь экран с сохранением Waybar (Monocle / Maximize)
bind = SUPER, Z, exec, ~/.config/hypr/scripts/window_mode.sh monocle
bind = SUPER, M, exec, ~/.config/hypr/scripts/window_mode.sh monocle

# 2. SUPER + F — Полный экран БЕЗ Waybar (настоящий fullscreen для игр/видео)
bind = SUPER, F, fullscreen, 0

# 3. SUPER + V — Переключить текущее окно: плавающее / в плитку
bind = SUPER, V, exec, ~/.config/hypr/scripts/window_mode.sh toggle_floating

# 4. SUPER + W — Переключение между режимами по кругу: [Плитка ↔ Макс с Waybar ↔ Windows]
bind = SUPER, W, exec, ~/.config/hypr/scripts/window_mode.sh cycle

# 5. SUPER + SHIFT + W — Принудительно включить режим обычной Windows (все окна плавают)
bind = SUPER SHIFT, W, exec, ~/.config/hypr/scripts/window_mode.sh windows

# 6. SUPER + SHIFT + T — Вернуть строгий тайлинг (плитку)
bind = SUPER SHIFT, T, exec, ~/.config/hypr/scripts/window_mode.sh tiling

# ------------------------------------------------------------------------------
# УПРАВЛЕНИЕ МЫШЬЮ В РЕЖИМЕ WINDOWS (Плавающие окна)
# ------------------------------------------------------------------------------
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

# ------------------------------------------------------------------------------
# БОКОВАЯ ПАНЕЛЬ И УПРАВЛЕНИЕ ТЕМОЙ
# ------------------------------------------------------------------------------
# Win + P — Показать / скрыть боковую панель настроек
bind = SUPER, P, exec, ~/.config/hypr/sidebar/toggle.sh

# Win + T — Быстрый запуск смены темы (или открытие сайдбара)
bind = SUPER, T, exec, ~/.config/hypr/sidebar/toggle.sh

# ------------------------------------------------------------------------------
# WAYBAR — позиция панели
# ------------------------------------------------------------------------------
bind = SUPER ALT, P,    exec, ~/.config/hypr/scripts/waybar_position.sh toggle
bind = SUPER ALT, up,   exec, ~/.config/hypr/scripts/waybar_position.sh top
bind = SUPER ALT, down, exec, ~/.config/hypr/scripts/waybar_position.sh bottom
bind = SUPER ALT, H,    exec, ~/.config/hypr/scripts/waybar_position.sh hide

# ------------------------------------------------------------------------------
# СМЕНА ОБОЕВ
# ------------------------------------------------------------------------------
bind = SUPER, bracketright, exec, ~/.config/hypr/scripts/wallpaper_cycle.sh next
bind = SUPER, bracketleft,  exec, ~/.config/hypr/scripts/wallpaper_cycle.sh prev
bind = SUPER ALT, W,        exec, ~/.config/hypr/scripts/wallpaper_cycle.sh next

# ------------------------------------------------------------------------------
# НАВИГАЦИЯ И ФОКУС
# ------------------------------------------------------------------------------
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

# Рабочие столы (1..10)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Перемещение окон между столами
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Изменение размера окон стрелками
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, left,  resizeactive, -40 0
binde = SUPER CTRL, up,    resizeactive, 0 -40
binde = SUPER CTRL, down,  resizeactive, 0 40

# Перемещение плиточных окон
bindl = SUPER SHIFT, left,  exec, hyprctl dispatch movewindow l
bindl = SUPER SHIFT, right, exec, hyprctl dispatch movewindow r
bindl = SUPER SHIFT, up,    exec, hyprctl dispatch movewindow u
bindl = SUPER SHIFT, down,  exec, hyprctl dispatch movewindow d

# ------------------------------------------------------------------------------
# МУЛЬТИМЕДИА И СИСТЕМНЫЕ КЛАВИШИ
# ------------------------------------------------------------------------------
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp,   exec, brightnessctl s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# ------------------------------------------------------------------------------
# СКРИНШОТЫ
# ------------------------------------------------------------------------------
bind = SUPER SHIFT, S, exec, grimblast copy area
bind = SUPER SHIFT, A, exec, grimblast save area ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = SUPER SHIFT, P, exec, grimblast save output ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = SUPER SHIFT, C, exec, grimblast copy output
bind = , Print,         exec, grimblast save output ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = SHIFT, Print,    exec, grimblast save area ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# ==============================================================================
# ПРАВИЛА ДЛЯ ОКОН (Синтаксис Hyprland v0.53+)
# ==============================================================================
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = float 1, match:class ^(nm-connection-editor)$
windowrule = float 1, match:class ^(wlogout)$
windowrule = float 1, match:title ^(Open File)$
windowrule = float 1, match:title ^(Save File)$
windowrule = float 1, match:title ^(Choose Wallpaper)$
