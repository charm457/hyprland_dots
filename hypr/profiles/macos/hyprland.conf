# ==============================================================================
# HYPRLAND CONFIGURATION — MACOS PROFILE (Cupertino / Sonoma)
# ==============================================================================

# Мониторы
monitor = , preferred, auto, 1

# Автозапуск
exec-once = ~/.config/hypr/scripts/init_desktop.sh

# Переменные окружения
env = GTK_USE_PORTAL,1
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = QT_WAYLAND_FORCE_DPI,physical
env = FREETYPE_PROPERTIES,truetype:interpreter-version=35
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Приложения по умолчанию
$terminal = kitty
$fileManager = ~/.config/hypr/scripts/file_manager.sh
$menu = rofi -show drun

# Ввод (Клавиатура)
input {
    kb_layout = us,ru
    kb_variant = ,
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

# Оформление в стиле macOS
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(ffffff66) rgba(ffffff22) 45deg
    col.inactive_border = rgba(ffffff15)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.94
    inactive_opacity = 0.85
    fullscreen_opacity = 0.98

    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = on
        vibrancy = 0.45
        brightness = 1.05
        contrast = 1.10
    }

    shadow {
        enabled = true
        range = 32
        render_power = 4
        color = rgba(00000055)
        color_inactive = rgba(00000033)
        offset = 0 8
    }
}

# Аутентичные плавные анимации macOS (Cubic-Bezier, Spaces свайп)
animations {
    enabled = yes
    bezier = macEase, 0.25, 1, 0.5, 1
    bezier = macSpring, 0.16, 1, 0.3, 1
    bezier = macSmooth, 0.4, 0.0, 0.2, 1

    animation = windows, 1, 5, macEase, popin 85%
    animation = windowsIn, 1, 5, macEase, popin 85%
    animation = windowsOut, 1, 4, macEase, popin 85%
    animation = border, 1, 6, macEase
    animation = fade, 1, 4, macEase
    animation = workspaces, 1, 6, macSpring, slide
}

dwindle {
    preserve_split = yes
}

# ==============================================================================
# АКТИВНЫЙ ПОДСТИЛЬ ТЕМЫ
# ==============================================================================
source = ~/.config/hypr/current_theme.conf

# ==============================================================================
# ГОРЯЧИЕ КЛАВИШИ
# ==============================================================================
bind = SUPER, RETURN,       exec, $terminal
bind = SUPER, B,            exec, firefox
bind = SUPER, E,            exec, $fileManager
bind = SUPER SHIFT, E,      exec, ~/.config/hypr/scripts/file_manager.sh yazi
bind = SUPER ALT, E,        exec, ~/.config/hypr/scripts/file_manager.sh gui
bind = SUPER, D,            exec, $menu
bind = SUPER, SPACE,        exec, $menu
bind = SUPER, Q,            killactive
bind = SUPER SHIFT, M,      exit

# Режимы окон
bind = SUPER, W,            exec, ~/.config/hypr/scripts/window_mode.sh cycle
bind = SUPER SHIFT, T,      exec, ~/.config/hypr/scripts/window_mode.sh tiling
bind = SUPER SHIFT, W,      exec, ~/.config/hypr/scripts/window_mode.sh floating
bind = SUPER, V,            exec, ~/.config/hypr/scripts/window_mode.sh toggle_floating
bind = SUPER, F,            fullscreen, 0

# Управление мышью
bindm = SUPER, mouse:272,   movewindow
bind = SUPER, mouse_down,   workspace, e+1
bind = SUPER, mouse_up,     workspace, e-1

# Боковая панель (Win + P)
bind = SUPER, P,            exec, ~/.config/hypr/sidebar/toggle.sh

# Waybar позиция
bind = SUPER ALT, P,        exec, ~/.config/hypr/scripts/waybar_position.sh toggle

# Смена обоев
bind = SUPER, bracketright, exec, ~/.config/hypr/scripts/wallpaper_cycle.sh next
bind = SUPER, bracketleft,  exec, ~/.config/hypr/scripts/wallpaper_cycle.sh prev

# Навигация фокуса
bind = SUPER, left,         movefocus, l
bind = SUPER, right,        movefocus, r
bind = SUPER, up,           movefocus, u
bind = SUPER, down,         movefocus, d

# Рабочие столы (1-10)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Перемещение окон (Super + Shift + стрелочки)
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d

# Мультимедиа и яркость
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp,   exec, brightnessctl s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Скриншоты
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = SUPER ALT, S,   exec, ~/.config/hypr/scripts/screenshot.sh menu
bind = , Print,         exec, ~/.config/hypr/scripts/screenshot.sh full
bind = SUPER, Print,   exec, ~/.config/hypr/scripts/screenshot.sh window

# Помощь и язык
bind = SUPER, slash,   exec, ~/.config/hypr/scripts/keybinds_help.sh
bind = SUPER, F1,      exec, ~/.config/hypr/scripts/keybinds_help.sh
bind = SUPER ALT, L,   exec, ~/.config/hypr/scripts/lang_ctl.sh toggle

# ==============================================================================
# ПРАВИЛА ДЛЯ ОКОН
# ==============================================================================
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(wlogout)$, float on
windowrule = match:title ^(Open File)$, float on
windowrule = match:title ^(Save File)$, float on
windowrule = match:title ^(Choose Wallpaper)$, float on

# Кастомный менеджер файлов (FileManager / Yazi)
windowrule = match:class ^(FileManager|yazi)$, float on
windowrule = match:class ^(FileManager|yazi)$, size 1100 700
windowrule = match:class ^(FileManager|yazi)$, center on
